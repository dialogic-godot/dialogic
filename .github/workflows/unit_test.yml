name: unit-test
run-name: ${{ github.head_ref || github.ref_name }}-unit-test

on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:


concurrency:
  group: unit-test-${{ github.event.number || github.run_id }}
  cancel-in-progress: true


jobs:
  unit-test:
    name: "CI Unit Test"
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 10 # The overall timeout
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      statuses: write

    steps:
      # checkout your repository
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show repository layout for debugging
        shell: bash
        run: |
          echo "Repository root: $PWD"
          ls -la
          echo "--- addons ---"
          find addons -maxdepth 2 -type f | sort | head -200
          echo "--- tests ---"
          find Tests -maxdepth 3 -type f | sort

      - name: Run GdUnit4 tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.5.1'
          project_dir: .
          paths: |
            res://Tests/Unit
          timeout: 10
          report-name: test_report.xml